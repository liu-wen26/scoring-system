version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: scoring_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoring
      POSTGRES_PASSWORD: scoring123
      POSTGRES_DB: scoring_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoring -d scoring_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scoring_network

  redis:
    image: redis:7-alpine
    container_name: scoring_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scoring_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: scoring_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - scoring_network

  minio:
    image: minio/minio:latest
    container_name: scoring_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - scoring_network

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: scoring_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://scoring:scoring123@db:5432/scoring_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://admin:admin123@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=scoring-images
      - MINIO_SECURE=false
      - SECRET_KEY=your-super-secret-key-change-this-in-production
      - DEBUG=false
      - LOG_LEVEL=INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - scoring_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: scoring_celery
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://scoring:scoring123@db:5432/scoring_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=amqp://admin:admin123@rabbitmq:5672//
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=scoring-images
      - MINIO_SECURE=false
      - SECRET_KEY=your-super-secret-key-change-this-in-production
      - DEBUG=false
    depends_on:
      - db
      - redis
      - rabbitmq
    networks:
      - scoring_network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: scoring_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - scoring_network

  nginx:
    image: nginx:alpine
    container_name: scoring_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - scoring_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:

networks:
  scoring_network:
    driver: bridge
